[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemem"
version = "0.1.0"
description = "A hierarchical long-term memory engine for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kandakatla Chandramouli"}
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0"
]

[project.scripts]
hivemem = "hivemem.cli:app"

[tool.setuptools.packages.find]
include = ["hivemem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
